<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>The blind spot · 24 / 20,000 (GIF source)</title>
<!--
  Frame source for profile/assets/blind-spot-{light,dark}.gif.
  Port of the "genes" field in aginglab.com/assets/js/site.js with a deterministic clock
  (measured markers → virtual omics → back). ?theme=dark switches the palette.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root {
    --page: #ffffff; --card: #ffffff; --soft: #f6f8f7; --line: #e4eae7;
    --ink: #0a1712; --ink-3: #5d6d66; --ink-4: #93a19a; --g-600: #0a8554; --g-700: #076b45;
    --thumb: #ffffff; --thumb-shadow: 0 1px 2px rgba(10,23,18,.06), 0 2px 10px rgba(10,23,18,.06);
    --up: rgba(10,133,84,.8); --down: rgba(120,142,133,.7); --off: #dfe6e2; --marker: #076b45;
    --font: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
:root.dark {
    --page: #0d1117; --card: #121e18; --soft: #0d1712; --line: #23362d;
    --ink: #e8f0eb; --ink-3: #93a19a; --ink-4: #6b7c74; --g-600: #2dc57f; --g-700: #7be0ae;
    --thumb: #1d3128; --thumb-shadow: none;
    --up: rgba(45,197,127,.85); --down: rgba(143,163,154,.65); --off: #22302a; --marker: #7be0ae;
}
* { box-sizing: border-box; transition: none !important; animation: none !important; }
html, body { margin: 0; background: var(--page); }
body { font-family: var(--font); -webkit-font-smoothing: antialiased; }

.genes { width: 880px; height: 470px; padding: 28px; border-radius: 28px; border: 1px solid var(--line); background: var(--card); position: relative; }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; height: 48px; }
.count { display: flex; align-items: baseline; gap: 12px; }
.count .v { font-size: 44px; font-weight: 700; letter-spacing: -.04em; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
.count .of { font-family: var(--mono); font-size: 13px; color: var(--ink-4); }
.count .l { font-size: 14px; color: var(--ink-3); }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); position: relative; }
.seg span.b { position: relative; z-index: 1; height: 36px; line-height: 36px; padding: 0 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; color: var(--ink-3); }
.seg span.b.on { color: var(--ink); }
.seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 999px; background: var(--thumb); box-shadow: var(--thumb-shadow); }
canvas { display: block; width: 822px; height: 306px; border-radius: 14px; background: var(--soft); }
.legend { display: flex; gap: 20px; margin-top: 14px; font-size: 13px; color: var(--ink-3); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend .src { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-4); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="genes">
    <div class="head">
        <div class="count">
            <span class="v" id="v">24</span>
            <span class="of">/ 20,000</span>
            <span class="l" id="lbl">실측 마커로 보이는 유전자</span>
        </div>
        <div class="seg" id="seg">
            <span class="thumb" id="thumb"></span>
            <span class="b on">실측 마커</span>
            <span class="b">가상오믹스</span>
        </div>
    </div>
    <canvas id="cv"></canvas>
    <div class="legend">
        <span><i style="background:var(--marker);border-radius:50%"></i>실측 마커</span>
        <span><i style="background:var(--up)"></i>발현 증가</span>
        <span><i style="background:var(--down)"></i>발현 감소</span>
        <span><i style="background:var(--off)"></i>관측되지 않음</span>
        <span class="src">THE BLIND SPOT · 예시</span>
    </div>
</div>

<script>
(function () {
    'use strict';
    var DARK = new URLSearchParams(location.search).get('theme') === 'dark';
    if (DARK) document.documentElement.classList.add('dark');
    var C = DARK
        ? { off: '#22302a', up: '45,197,127', down: '143,163,154', downA: .6, marker: '#7be0ae', halo: '45,197,127', haloA: .22 }
        : { off: '#dfe6e2', up: '10,133,84', down: '120,142,133', downA: .7, marker: '#076b45', halo: '16,165,100', haloA: .16 };

    function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
    function ease(p) { return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }

    var gc = document.getElementById('cv'), gctx = gc.getContext('2d');
    var countEl = document.getElementById('v'), lbl = document.getElementById('lbl');
    var btns = document.querySelectorAll('.seg .b'), thumb = document.getElementById('thumb');

    var TOTAL = 20000, MARKERS = 24, GCOLS = 200, GROWS = 100;
    var vals = new Float32Array(TOTAL), markerIdx = [];
    var seedRand = (function (s) { return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; })(7);
    for (var gi = 0; gi < TOTAL; gi++) {
        var x = gi % GCOLS, y = Math.floor(gi / GCOLS);
        var v = Math.sin(x * 0.11 + 1.3) * Math.cos(y * 0.17) * 0.55 + Math.sin((x + y) * 0.05) * 0.35 + (seedRand() - 0.5) * 0.7;
        vals[gi] = clamp(v, -1, 1);
    }
    while (markerIdx.length < MARKERS) {
        var m = Math.floor(seedRand() * TOTAL);
        if (markerIdx.indexOf(m) < 0) markerIdx.push(m);
    }
    var isMarker = new Uint8Array(TOTAL);
    markerIdx.forEach(function (k) { isMarker[k] = 1; });

    var gw = 822, gh = 306, gdpr = window.devicePixelRatio || 1;
    gc.width = Math.round(gw * gdpr); gc.height = Math.round(gh * gdpr);

    function drawGenes(prog) {
        gctx.setTransform(gdpr, 0, 0, gdpr, 0, 0);
        gctx.clearRect(0, 0, gw, gh);
        var pad = 12;
        var cw = (gw - pad * 2) / GCOLS, ch = (gh - pad * 2) / GROWS;
        var s = Math.max(0.8, Math.min(cw, ch) * 0.72);
        var wave = prog * (GCOLS + 40);
        for (var i = 0; i < TOTAL; i++) {
            if (isMarker[i]) continue;
            var cx = i % GCOLS, cy = (i / GCOLS) | 0;
            var px = pad + cx * cw, py = pad + cy * ch;
            var local = clamp((wave - cx - (cy % 7) * 2) / 40, 0, 1);
            var v = vals[i];
            if (local <= 0) gctx.fillStyle = C.off;
            else if (v >= 0) gctx.fillStyle = 'rgba(' + C.up + ',' + (0.12 + 0.88 * Math.abs(v) * local).toFixed(3) + ')';
            else gctx.fillStyle = 'rgba(' + C.down + ',' + (0.12 + C.downA * Math.abs(v) * local).toFixed(3) + ')';
            gctx.fillRect(px, py, s, s);
        }
        markerIdx.forEach(function (i) {
            var cx = i % GCOLS, cy = (i / GCOLS) | 0;
            var px = pad + cx * cw + s / 2, py = pad + cy * ch + s / 2;
            gctx.beginPath();
            gctx.arc(px, py, Math.max(5, s * 2.4), 0, Math.PI * 2);
            gctx.fillStyle = 'rgba(' + C.halo + ',' + (C.haloA * (1 - prog * 0.7)).toFixed(3) + ')';
            gctx.fill();
            gctx.beginPath();
            gctx.arc(px, py, Math.max(2.4, s * 1.1), 0, Math.PI * 2);
            gctx.fillStyle = C.marker;
            gctx.fill();
        });
    }

    // timeline: hold measured → reveal (1.8 s) → hold virtual → retract (1.8 s)
    var LOOP = 9.0, UP = 1.4, DOWN = 6.2, ANIM = 1.8, THUMB = .45;
    function progAt(t) {
        if (t < UP) return 0;
        if (t < UP + ANIM) return ease((t - UP) / ANIM);
        if (t < DOWN) return 1;
        if (t < DOWN + ANIM) return 1 - ease((t - DOWN) / ANIM);
        return 0;
    }
    function thumbAt(t) {   // 0 = left button, 1 = right button
        var e = function (p) { return 1 - Math.pow(1 - clamp(p, 0, 1), 3); };
        if (t < UP) return 0;
        if (t < DOWN) return e((t - UP) / THUMB);
        return 1 - e((t - DOWN) / THUMB);
    }

    function render(t) {
        var prog = progAt(t);
        drawGenes(prog);
        countEl.textContent = Math.round(MARKERS + (TOTAL - MARKERS) * prog).toLocaleString('en-US');
        var virt = t >= UP && t < DOWN;
        lbl.textContent = virt ? '가상오믹스로 보이는 유전자' : '실측 마커로 보이는 유전자';
        btns[0].classList.toggle('on', !virt);
        btns[1].classList.toggle('on', virt);
        var k = thumbAt(t);
        var l0 = btns[0].offsetLeft, w0 = btns[0].offsetWidth, l1 = btns[1].offsetLeft, w1 = btns[1].offsetWidth;
        thumb.style.width = (w0 + (w1 - w0) * k) + 'px';
        thumb.style.transform = 'translateX(' + (l0 + (l1 - l0) * k) + 'px)';
    }

    window.LOOP = LOOP;
    window.renderAt = function (t) { render(((t % LOOP) + LOOP) % LOOP); return true; };

    var sample = '실측 마커로 보이는 유전자 가상오믹스로 보이는 유전자 발현 증가 감소 관측되지 않음 예시 0123456789,';
    Promise.all([
        document.fonts.load('700 44px "Pretendard Variable"', '0123456789,'),
        document.fonts.load('600 13.5px "Pretendard Variable"', sample),
        document.fonts.load('400 14px "Pretendard Variable"', sample),
        document.fonts.load('400 13px "JetBrains Mono"', '/ 20,000 THE BLIND SPOT'),
        document.fonts.ready
    ]).then(function () { render(0); window.READY = true; });
})();
</script>
</body>
</html>
